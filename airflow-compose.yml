services:
  airflow:
    image: apache/airflow:2.10.5-python3.11
    container_name: risk_airflow
    ports:
      - "8081:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    volumes:
      - "./airflow/dags:/opt/airflow/dags"
    command: standalone