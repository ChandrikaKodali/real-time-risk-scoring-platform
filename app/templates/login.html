<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RiskGuard | Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f172a, #1e293b);
        }

        .login-container {
            width: 380px;
            padding: 40px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #0f172a;
            font-size: 30px;
            margin-bottom: 8px;
        }

        .logo p {
            color: #64748b;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #334155;
            font-size: 14px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
        }

        .form-group input:focus {
            border-color: #2563eb;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .login-btn:hover {
            background: #1d4ed8;
        }

        .error {
            display: none;
            margin-top: 15px;
            padding: 10px;
            background: #fee2e2;
            color: #b91c1c;
            border-radius: 7px;
            text-align: center;
            font-size: 14px;
        }

        .demo {
            margin-top: 25px;
            padding: 12px;
            background: #f1f5f9;
            border-radius: 8px;
            text-align: center;
            color: #475569;
            font-size: 13px;
        }

        .demo strong {
            color: #0f172a;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">
            <h1>RiskGuard</h1>
            <p>Real-Time Risk Monitoring Platform</p>
        </div>

        <form id="loginForm">

            <div class="form-group">
                <label for="username">Username</label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >
            </div>

            <button type="submit" class="login-btn">
                Login
            </button>

            <div id="errorMessage" class="error">
                Invalid username or password
            </div>

        </form>

        <div class="demo">
            <strong>Demo Login</strong><br><br>
            Username: admin<br>
            Password: admin123
        </div>

    </div>


    <script>

        document
            .getElementById("loginForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                const username =
                    document.getElementById("username").value;

                const password =
                    document.getElementById("password").value;

                const errorMessage =
                    document.getElementById("errorMessage");


                if (
                    username === "admin" &&
                    password === "admin123"
                ) {

                    // Go to the Risk Dashboard
                    window.location.href = "/dashboard";

                } else {

                    errorMessage.style.display = "block";

                }

            });

    </script>

</body>
</html>
