apiVersion: apps/v1
kind: Deployment
metadata:
  name: risk-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: risk-redis
  template:
    metadata:
      labels:
        app: risk-redis
    spec:
      containers:
        - name: redis
          image: redis:7
          ports:
            - containerPort: 6379

---
apiVersion: v1
kind: Service
metadata:
  name: risk-redis
spec:
  selector:
    app: risk-redis
  ports:
    - port: 6379
      targetPort: 6379